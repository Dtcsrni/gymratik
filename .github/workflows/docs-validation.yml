name: docs-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts and documentation
        run: python scripts/validate_repository.py
      - name: Test canonical routine generation and script integrity
        run: python tests/routines/test_canonical_routines.py
      - name: Verify generated PWA service worker
        run: |
          python scripts/build_pwa_service_worker.py
          git diff --exit-code -- sw.js
